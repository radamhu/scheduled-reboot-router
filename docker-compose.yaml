services:
  router-reboot:
    build: .
    restart: unless-stopped
    init: true
    shm_size: 256m
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    environment:
      ROUTER_URL: ${ROUTER_URL:-https://192.168.0.1}
      ROUTER_USERNAME: ${ROUTER_USERNAME:?}
      ROUTER_PASSWORD: ${ROUTER_PASSWORD:?}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
